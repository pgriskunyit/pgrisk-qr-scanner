<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGRI QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0002;
    }

    h2 { font-size: 20px; margin-top: 0; }

    #reader {
      width: 100%;
      margin: 15px auto;
      border-radius: 8px;
      overflow: hidden;
    }

    #status {
      margin: 15px 0;
      font-size: 14px;
      overflow-wrap: anywhere;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Scanner QR Code PGRI</h2>
  <p>Arahkan kamera ke QR Code kartu PGRI.</p>

  <!-- Kotak Kamera Scanner Langsung Tampil -->
  <div id="reader"></div>

  <div id="status">Meminta izin kamera...</div>

</div>

<!-- Elemen Audio tersembunyi menggunakan Data URI (Suara Beep pendek bawaan) -->
<audio id="beepAudio" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..." crossorigin="anonymous">
</audio>

<script>
  let scanner = null;
  let running = false;
  let processing = false;

  // Fungsi untuk memutar suara beep instan tanpa tombol tambahan
  function playBeep() {
    const audio = document.getElementById('beepAudio');
    if (audio) {
      audio.currentTime = 0;
      audio.play().catch(e => {
        // Jika browser memblokir, kita gunakan Web Audio API sebagai cadangan
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (err) {}
      });
    }
  }

  function showStatus(message, color) {
    const el = document.getElementById("status");
    el.innerText = message;
    el.style.color = color || "#333";
  }

  async function startScanner() {
    if (running) return;

    if (typeof Html5Qrcode === "undefined") {
      showStatus("Library scanner gagal dimuat.", "red");
      return;
    }

    try {
      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      await scanner.start(
        { facingMode: "environment" }, // Kamera belakang HP
        {
          fps: 10,
          qrbox: { width: 220, height: 220 }
        },
        async function(decodedText) {
          if (processing) return;
          processing = true;

          // Bunyikan audio beep otomatis saat QR berhasil dibaca
          playBeep();

          showStatus("QR berhasil dibaca!", "green");

          try {
            await scanner.stop();
          } catch(e) {}

          running = false;

          // Kirim hasil ke halaman utama (form pendaftaran)
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: "PGRI_QR_RESULT",
              value: decodedText.trim()
            }, "*");

            showStatus("Berhasil! Menutup scanner...", "green");
            setTimeout(() => window.close(), 800);
          } else {
            showStatus("QR terbaca: " + decodedText, "green");
            processing = false;
          }
        },
        function(error) {
          // Error per frame diabaikan
        }
      );

      running = true;
      showStatus("Silakan scan QR Code untuk mendaftar Jalan Sehat PGRI.", "green");

    } catch (error) {
      console.error(error);
      showStatus("Gagal akses kamera. Pastikan izin kamera diaktifkan.", "red");
    }
  }

  // Langsung aktifkan kamera begitu halaman selesai dimuat (seperti semula)
  window.addEventListener("load", function() {
    startScanner();
  });
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGRI QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0002;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
      border-radius: 8px;
      overflow: hidden;
    }

    #status {
      margin: 15px 0;
      font-size: 14px;
      overflow-wrap: anywhere;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <h2 style="line-height: 1.4;">Scanner QR Code <br><span style="display: block;">PGRI Sungai Kunyit</span></h2>
  <p>Arahkan kamera ke QR Code kartu PGRI.</p>

  <div id="reader"></div>

  <div id="status">Menyiapkan kamera dan audio...</div>

</div>

<script>
  let scanner = null;
  let running = false;
  let processing = false;

  // ==========================================
  // SISTEM AUDIO BEEP OTOMATIS
  // ==========================================

  let audioCtx = null;
  let audioReady = false;

  // Membuat AudioContext satu kali saja
  function initAudio() {
    if (audioCtx) return;

    try {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        console.warn("Web Audio API tidak didukung browser.");
        return;
      }

      audioCtx = new AudioContextClass();

      // Mencoba mengaktifkan audio sedini mungkin
      unlockAudio();

    } catch (error) {
      console.warn("Gagal menyiapkan audio:", error);
    }
  }

  // Mengaktifkan AudioContext
  async function unlockAudio() {
    if (!audioCtx) return false;

    try {
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      audioReady = audioCtx.state === "running";

      return audioReady;

    } catch (error) {
      audioReady = false;
      console.warn("Audio belum dapat diaktifkan:", error);
      return false;
    }
  }

  // Persiapan audio melalui interaksi alami pengguna.
  // Tidak menambahkan tombol atau langkah khusus.
  function setupAudioUnlock() {
    const events = [
      "pointerdown",
      "touchstart",
      "keydown"
    ];

    events.forEach(eventName => {
      document.addEventListener(eventName, function() {
        unlockAudio();
      }, { passive: true });
    });
  }

  // Menghasilkan bunyi beep tanpa file eksternal
  
async function playBeep() {
  if (!audioCtx) {
    initAudio();
  }

  if (!audioCtx) return;

  if (audioCtx.state !== "running") {
    await unlockAudio();
  }

  if (audioCtx.state !== "running") return;

  try {
    const now = audioCtx.currentTime;

    // Dua nada elektronik yang tajam
    const frequencies = [1450, 1950];

    frequencies.forEach((frequency, index) => {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(
        frequency,
        now
      );

      const start = now + (index * 0.045);
      const duration = 0.075;

      gainNode.gain.setValueAtTime(0.0001, start);
      gainNode.gain.exponentialRampToValueAtTime(
        0.12,
        start + 0.005
      );
      gainNode.gain.exponentialRampToValueAtTime(
        0.0001,
        start + duration
      );

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start(start);
      oscillator.stop(start + duration + 0.005);
    });

    audioReady = true;

  } catch (error) {
    console.warn("Gagal memutar beep:", error);
  }
}


  // ==========================================
  // STATUS SCANNER
  // ==========================================

  function showStatus(message, color) {
    const el = document.getElementById("status");
    el.innerText = message;
    el.style.color = color || "#333";
  }

  // ==========================================
  // SCANNER QR CODE
  // ==========================================

  async function startScanner() {
    if (running) return;

    if (typeof Html5Qrcode === "undefined") {
      showStatus("Library scanner gagal dimuat.", "red");
      return;
    }

    try {
      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      await scanner.start(
        { facingMode: "environment" },

        {
          fps: 10,
          qrbox: {
            width: 220,
            height: 220
          }
        },

        async function(decodedText) {

          // Mencegah QR yang sama diproses berulang kali
          if (processing) return;

          processing = true;

          // Bunyikan beep saat QR berhasil dibaca
          playBeep();

          showStatus("QR berhasil dibaca!", "green");

          try {
            await scanner.stop();
          } catch (error) {
            console.warn("Scanner stop:", error);
          }

          running = false;

          // Kirim hasil scan ke halaman form utama
          if (window.opener && !window.opener.closed) {

            window.opener.postMessage({
              type: "PGRI_QR_RESULT",
              value: decodedText.trim()
            }, "*");

            showStatus(
              "Berhasil! Menutup scanner...",
              "green"
            );

            setTimeout(function() {
              window.close();
            }, 800);

          } else {

            showStatus(
              "QR terbaca: " + decodedText,
              "green"
            );

            processing = false;
          }
        },

        function(errorMessage) {
          // Error pembacaan per frame diabaikan
        }
      );

      running = true;

      showStatus(
        "Silakan scan QR Code untuk mendaftar Jalan Sehat PGRI.",
        "green"
      );

    } catch (error) {
      console.error(error);

      showStatus(
        "Gagal akses kamera. Pastikan izin kamera diaktifkan.",
        "red"
      );
    }
  }

  // ==========================================
  // INISIALISASI OTOMATIS
  // ==========================================

  window.addEventListener("load", function() {

    // Persiapkan audio terlebih dahulu
    initAudio();

    // Dengarkan interaksi alami tanpa tombol tambahan
    setupAudioUnlock();

    // Kamera langsung aktif
    startScanner();

  });

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGRI QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0002;
    }

    h2 { font-size: 20px; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #198754;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin: 15px 0;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Scanner QR Code PGRI</h2>

  <p>Arahkan kamera ke QR Code kartu anggota.</p>

  <div id="reader"></div>

  <div id="status">Scanner siap digunakan.</div>

  <button id="startButton" onclick="startScanner()">
    Aktifkan Kamera
  </button>

</div>

<script>

  let scanner = null;
  let running = false;
  let processing = false;

  function showStatus(message, color) {
    const el = document.getElementById("status");
    el.innerText = message;
    el.style.color = color || "#333";
  }

  async function startScanner() {

    if (running) return;

    if (typeof Html5Qrcode === "undefined") {
      showStatus("Library scanner gagal dimuat.", "red");
      return;
    }

    const button = document.getElementById("startButton");
    button.disabled = true;

    showStatus("Meminta izin kamera...", "#007bff");

    try {

      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 220, height: 220 }
        },

        async function(decodedText) {

          if (processing) return;
          processing = true;

          showStatus("QR berhasil dibaca!", "green");

          try {
            await scanner.stop();
          } catch(e) {}

          running = false;

          // Kirim hasil ke halaman pembuka
          if (window.opener && !window.opener.closed) {

            window.opener.postMessage({
              type: "PGRI_QR_RESULT",
              value: decodedText.trim()
            }, "*");

            showStatus(
              "Berhasil! Kembali ke form pendaftaran.",
              "green"
            );

            setTimeout(() => window.close(), 1000);

          } else {

            showStatus(
              "QR terbaca: " + decodedText,
              "green"
            );

            processing = false;
          }

        },

        function(error) {}

      );

      running = true;
      button.innerText = "Kamera Aktif";

      showStatus(
        "Kamera aktif. Silakan scan QR Code.",
        "green"
      );

    } catch(error) {

      console.error(error);

      showStatus(
        "Gagal: " + error.name + " - " + error.message,
        "red"
      );

    } finally {

      button.disabled = false;

    }
  }

</script>

</body>
</html>
